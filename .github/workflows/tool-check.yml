name: AI Tool Vault Check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check official tool pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          REPO = os.environ["REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          API = f"https://api.github.com/repos/{REPO}"
          STATE_TITLE = "[Tool Check] Baseline state"
          MAX_BYTES = 2_000_000
          TIMEOUT = 25

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag.lower() in {"script", "style", "noscript", "svg"}:
                      self.skip += 1

              def handle_endtag(self, tag):
                  if tag.lower() in {"script", "style", "noscript", "svg"} and self.skip:
                      self.skip -= 1

              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          def github(method, path, body=None):
              headers = {
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "AI-Tool-Vault-tool-check",
              }
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(API + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=TIMEOUT) as response:
                  return json.load(response)

          def normalize(html):
              parser = TextExtractor()
              parser.feed(html)
              text = " ".join(parser.parts)
              text = re.sub(r"\s+", " ", text).strip().lower()
              terms = (
                  "price", "pricing", "free", "credits", "plan", "month", "year",
                  "feature", "features", "limit", "usage", "included"
              )
              sentences = re.split(r"(?<=[.!?])\s+", text)
              relevant = [s for s in sentences if any(term in s for term in terms)]
              return " ".join(relevant)[:200_000]

          def urls_from_file(path):
              text = path.read_text(encoding="utf-8")
              urls = re.findall(r"https?://[^\s)<>]+", text)
              clean = []
              for url in urls:
                  url = url.rstrip(".,;\"'")
                  if url not in clean:
                      clean.append(url)
              return clean

          records = []
          for path in sorted(Path("tools").glob("*.md")):
              if path.name.lower() == "readme.md":
                  continue
              urls = urls_from_file(path)
              if not urls:
                  records.append({"file": str(path), "status": "no_url"})
                  continue
              for url in urls:
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "AI-Tool-Vault-tool-check/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=TIMEOUT) as response:
                          raw = response.read(MAX_BYTES)
                          final_url = response.geturl()
                          content_type = response.headers.get("Content-Type", "")
                      if "text/html" not in content_type and "application/xhtml+xml" not in content_type:
                          records.append({"file": str(path), "url": url, "status": "non_html"})
                          continue
                      relevant = normalize(raw.decode("utf-8", errors="replace"))
                      digest = hashlib.sha256(relevant.encode()).hexdigest()
                      records.append({
                          "file": str(path),
                          "url": url,
                          "final_url": final_url,
                          "status": "ok",
                          "hash": digest,
                      })
                  except Exception as exc:
                      records.append({
                          "file": str(path),
                          "url": url,
                          "status": "error",
                          "error": str(exc)[:300],
                      })

          current = {
              r["file"] + "|" + r.get("url", ""): r
              for r in records
              if r.get("status") == "ok"
          }

          issues = github("GET", "/issues?state=all&labels=tool-check&per_page=100")
          baseline = next((issue for issue in issues if issue.get("title") == STATE_TITLE), None)
          previous = {}

          if baseline:
              match = re.search(
                  r"<!-- TOOL_CHECK_STATE\n(.*?)\nTOOL_CHECK_STATE -->",
                  baseline.get("body", ""),
                  re.S,
              )
              if match:
                  try:
                      previous = json.loads(match.group(1))
                  except json.JSONDecodeError:
                      previous = {}

          changes = []
          for key, item in current.items():
              old = previous.get(key)
              if old is None:
                  continue
              if old.get("hash") != item.get("hash"):
                  changes.append({"type": "content_changed", **item})

          for key, old in previous.items():
              if key not in current and old.get("status") == "ok":
                  changes.append({"type": "url_missing", **old})

          state_body = (
              "<!-- TOOL_CHECK_STATE\n"
              + json.dumps(current, sort_keys=True, indent=2)
              + "\nTOOL_CHECK_STATE -->"
          )

          if baseline:
              github(
                  "PATCH",
                  f"/issues/{baseline['number']}",
                  {
                      "body": (
                          "Automated state used to compare official AI tool pages between checks.\n\n"
                          + state_body
                      )
                  },
              )
          else:
              github(
                  "POST",
                  "/issues",
                  {
                      "title": STATE_TITLE,
                      "body": (
                          "Automated state used to compare official AI tool pages between checks.\n\n"
                          + state_body
                      ),
                      "labels": ["tool-check"],
                  },
              )

          if not changes:
              print("No meaningful page changes detected.")
              sys.exit(0)

          lines = [
              "## AI Tool Vault: detected changes",
              "",
              "This report is informational only. **No repository files or prices were changed automatically.**",
              "",
          ]
          for change in changes:
              lines.append(f"- **{change.get('file')}** — `{change['type']}`")
              lines.append(f"  - URL: {change.get('url', 'unknown')}")

          lines += [
              "",
              "### Required review",
              "",
              "1. Open the official page.",
              "2. Confirm whether pricing, limits, availability, or features actually changed.",
              "3. Update the relevant tool file and `TOOLS.md` manually if necessary.",
              "4. Do not treat this report as proof of a pricing change; dynamic pages can change for unrelated reasons.",
          ]

          body = "\n".join(lines)
          github(
              "POST",
              "/issues",
              {
                  "title": "AI Tool Vault: tool information change detected",
                  "body": body,
                  "labels": ["tool-check"],
              },
          )
          print(body)
          PY
